<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explorador de imágenes</title><link rel="stylesheet" href="./style.css"></head><body>
<main><small>Lenguajes IV · TP 03</small><h1>Explorador de imágenes</h1><section class="panel"><p>Seleccionar imagen</p><input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif,.img" hidden><button id="select" type="button">Seleccionar imagen</button>
<output id="file-state" aria-live="polite"></output><dl id="details" hidden><dt>Nombre</dt><dd id="name"></dd><dt>Tipo</dt><dd id="type"></dd><dt>Tamaño</dt><dd id="size"></dd></dl><img id="preview" alt="Vista previa de la imagen seleccionada" hidden></section></main>
<script type="module" src="./main.js"></script></body></html>
